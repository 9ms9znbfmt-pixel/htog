<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Conversations — HtoG</title>
    <link rel="stylesheet" href="style.css?v=20261126-1" />
    <link rel="stylesheet" href="comments.css?v=20261128-1" />
    <script src="comments-config.js?v=20261128-1" defer></script>
    <script src="comments-api.js?v=20261128-1" defer></script>
    <script src="comments-admin.js?v=20261128-1" defer></script>
  </head>
  <body>
    <main class="comment-admin">
      <a class="text-link" href="index.html">← HtoG</a>
      <h1>After looking,<br />a conversation.</h1>
      <p class="comment-admin-intro">남겨진 이야기를 읽고 답해주세요.<br />확인한 글만 공개할 수 있습니다.</p>
      <form id="admin-login" class="comment-admin-login">
        <label for="admin-email">관리자 이메일</label>
        <input id="admin-email" name="email" type="email" autocomplete="username" required />
        <label for="admin-password">비밀번호</label>
        <input id="admin-password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit">로그인</button>
      </form>
      <p id="admin-status" class="comment-admin-feedback" role="status" aria-live="polite"></p>
      <section id="admin-panel" hidden aria-label="이야기 관리">
        <div class="comment-admin-toolbar">
          <div><label for="admin-filter">공개 상태</label><select id="admin-filter"><option value="pending">확인 대기</option><option value="approved">공개 중</option><option value="all">전체</option></select></div>
          <div><label for="admin-series">사진 시리즈</label><select id="admin-series"><option value="all">전체 시리즈</option><option value="classic-cars">Classic Car Show</option><option value="japan">Japan, in passing</option></select></div>
          <button id="admin-refresh" type="button">새로고침</button>
          <button id="admin-logout" type="button">로그아웃</button>
        </div>
        <div id="admin-list"></div>
        <button id="admin-more" type="button" hidden>더 불러오기 ↓</button>
      </section>
    </main>
  </body>
</html>
